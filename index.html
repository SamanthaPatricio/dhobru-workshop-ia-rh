<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop IA no RH | DHOBRU</title><style>html,body{margin:0;background:#071323;color:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#loading b{display:block;font-size:20px;margin-bottom:8px}</style></head><body><div id="loading"><div><b>DHOBRU</b>Carregando experiência...</div></div><script>(async()=>{try{const n=16;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch(`parts/p${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw new Error('Parte '+i);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('loading').innerHTML='<div><b>DHOBRU</b>Não foi possível carregar a página.</div>';console.error(e)}})();</script></body></html>
